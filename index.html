<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KUSKA demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap">
<style>
:root{
  --ink:#34296D; --ink2:#282055; --acc:#735BF2; --acc-press:#5C47C8; --acc-mid:#6852DA; --acc-soft:#D4CCFB; --acc-faint:#F1EFFE;
  --link:#5C49C2; --pale:#D4CCFB; --lila:#F7F5FF; --brand:#C15DE5; --plum:#9146AC; --pink:#F9EFFC; --lime:#D2E05A;
  --display:'Quicksand',system-ui,sans-serif; --text:'Poppins',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lila:#F7F5FF}}
:root[data-theme="dark"]{--lila:#F7F5FF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#ECE8FB;color:var(--ink);font-family:var(--text);font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
/* sin marco de celular: en el celular ocupa la pantalla; en computadora columna centrada con ancho de celular */
#stage{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-start;background:#fff}
#phone{position:relative;overflow:hidden;background:#fff;container-type:size;
  width:100vw;height:100vh;height:calc(100dvh - env(safe-area-inset-bottom,0px));--u:calc(100cqw / 402)}
@media (min-width:560px){
  #stage{background:#ECE8FB}
  #phone{width:min(100vw,402px,calc(100dvh * 402 / 874));height:100vh;height:100dvh}
}
#status{display:none!important}
/* unidades del frame Figma (402 de ancho) */
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg,#fff);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.fr{position:relative;width:100%;--u:calc(100cqw / 402)}
.fr.fit{--u:min(calc(100cqw / 402),calc(100cqh / 874));width:calc(var(--u) * 402);height:calc(var(--u) * 874);margin:0 auto}
.a{position:absolute}
.ctr{text-align:center}
img{display:block;user-select:none;-webkit-user-drag:none}
.msk{display:block;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;background:currentColor}

/* transiciones suaves entre pantallas */
.scr.in{animation:sin .42s cubic-bezier(.22,.8,.24,1) both}
.scr.out{animation:sout .3s ease both;pointer-events:none}
@keyframes sin{from{opacity:0;transform:translateX(calc(var(--dx,1) * 28px))}to{opacity:1;transform:none}}
@keyframes sout{to{opacity:0;transform:translateX(calc(var(--dx,1) * -18px))}}
@media (prefers-reduced-motion:reduce){.scr.in,.scr.out{animation-duration:.01s}}

/* barra de estado del teléfono */
#status{position:absolute;left:0;right:0;top:0;height:calc(var(--u) * 50);z-index:30;pointer-events:none;background:var(--sbg,transparent);transition:background .3s}
#status b{position:absolute;left:calc(var(--u) * 49.5);top:calc(var(--u) * 26);font:600 calc(var(--u) * 16)/1 var(--text);color:var(--ink2);letter-spacing:-.01em}
#status i{position:absolute;left:calc(var(--u) * 298);top:calc(var(--u) * 25);width:calc(var(--u) * 78);height:calc(var(--u) * 16);color:var(--ink2)}

/* tipografía */
.h-disp{font-family:var(--display);color:var(--ink)}
.p{font-family:var(--text);font-weight:300;color:var(--ink)}

/* botones del UI kit */
.btn{border:0;border-radius:999px;background:var(--acc);color:#fff;font:700 calc(var(--u) * 16)/1 var(--display);cursor:pointer;
  box-shadow:0 calc(var(--u) * 4) calc(var(--u) * 10) calc(var(--u) * -4) rgba(115,91,242,.55);transition:background .15s,transform .15s;-webkit-tap-highlight-color:transparent}
.btn:hover{background:#6A51EE}.btn:active{background:var(--acc-press);transform:scale(.985)}
.go{display:flex;align-items:center;justify-content:center}
.go .c{position:absolute;left:calc(var(--u) * 4);top:calc(var(--u) * 4);width:calc(var(--u) * 42);height:calc(var(--u) * 42);border-radius:50%;background:#fff;color:var(--acc);display:grid;place-items:center;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.go:hover .c{transform:translateX(calc(var(--u) * 3))}
.round{border:0;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 calc(var(--u) * 4) calc(var(--u) * 10) calc(var(--u) * -4) rgba(115,91,242,.6);transition:transform .2s}
.round:hover{transform:translateX(calc(var(--u) * 2))}.round:active{transform:scale(.94)}
.lnk{border:0;background:none;padding:0;cursor:pointer;font:400 calc(var(--u) * 15)/1.4 var(--text);color:var(--link)}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.foot{display:flex;justify-content:center;align-items:center;gap:calc(var(--u) * 8);font:300 calc(var(--u) * 13)/1 var(--text)}
.foot .lnk{font-size:calc(var(--u) * 13);font-weight:300}
.foot .lnk.g{color:var(--pale)} .foot .dot{color:var(--pale)}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:12px}

/* pager */
.dots{display:flex;gap:calc(var(--u) * 4);align-items:center}
.dots button{width:calc(var(--u) * 8);height:calc(var(--u) * 8);border-radius:9px;border:0;padding:0;background:#F1EFFE;cursor:pointer;transition:width .35s cubic-bezier(.3,1.3,.5,1),background .3s}
.dots button.on{width:calc(var(--u) * 16);background:var(--acc)}

/* Kuska: solo movimiento, nunca redibujado */
.kuska{cursor:pointer;transform-origin:50% 90%;-webkit-tap-highlight-color:transparent}
.float{animation:float 3.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(calc(var(--u) * -5))}}
.hop{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{30%{transform:translateY(calc(var(--u) * -10)) scale(1.03,.97)}60%{transform:translateY(0) scale(.98,1.02)}}
.wiggle{animation:wig .6s ease}
@keyframes wig{20%{transform:rotate(-6deg)}45%{transform:rotate(5deg)}70%{transform:rotate(-3deg)}}
.pop-in{animation:popin .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes popin{from{opacity:0;transform:scale(.6) translateY(calc(var(--u) * 20))}}
.rise{animation:rise 1.1s cubic-bezier(.2,.9,.25,1) .15s both}
@keyframes rise{from{transform:translateY(60%)}}
.fadeup{animation:fadeup .7s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(calc(var(--u) * 10))}}
.shake{animation:shake .4s ease}
@keyframes shake{25%{transform:translateX(calc(var(--u) * -6))}50%{transform:translateX(calc(var(--u) * 5))}75%{transform:translateX(calc(var(--u) * -3))}}

/* campos */
.field{border:0;border-bottom:1px solid var(--acc-mid);background:none;outline:none;padding:0 0 calc(var(--u) * 8);font:300 calc(var(--u) * 15)/1.3 var(--text);color:var(--ink);border-radius:0;transition:border-color .2s}
.field::placeholder{color:var(--acc-mid);opacity:1}
.field:focus{border-bottom:2px solid var(--acc);padding-bottom:calc(var(--u) * 7)}
.field.err{border-bottom-color:var(--brand)}
.hint{font:400 calc(var(--u) * 12)/1.3 var(--text);color:var(--brand);opacity:0;transform:translateY(-4px);transition:.25s}
.hint.on{opacity:1;transform:none}
.eye{border:0;background:none;padding:0;cursor:pointer;color:var(--pale);transition:color .2s}
.eye.on{color:var(--acc)}

/* carrusel de tarjetas del registro */
.car{overflow:visible;touch-action:pan-y}
.track{position:absolute;left:0;top:0;height:100%;display:flex;transition:transform .8s cubic-bezier(.25,.9,.3,1)}
.track.drag{transition:none}
.card{position:relative;flex:none;width:calc(var(--u) * 300);height:calc(var(--u) * 300);margin-right:calc(var(--u) * 6);background:url(img/blob.webp) center/100% 100% no-repeat;filter:drop-shadow(0 calc(var(--u) * 6) calc(var(--u) * 14) rgba(115,91,242,.06));transition:opacity .6s,transform .8s cubic-bezier(.25,.9,.3,1)}
.card h3{position:absolute;left:0;right:0;top:calc(var(--u) * 46);margin:0;text-align:center;font:700 calc(var(--u) * 21)/calc(var(--u) * 40) var(--display);color:var(--ink2)}
.card .q{position:absolute;left:calc(var(--u) * 45);right:calc(var(--u) * 45);top:calc(var(--u) * 86);text-align:center;font:300 calc(var(--u) * 14)/calc(var(--u) * 24) var(--text);color:#BFB8EA}
.card .op{position:absolute;left:calc(var(--u) * 50.5);width:calc(var(--u) * 200);height:calc(var(--u) * 45);border-radius:999px;cursor:pointer;
  font:300 calc(var(--u) * 15)/1 var(--text);color:#8F86C9;background:var(--acc-faint);border:1.5px solid transparent;box-shadow:0 calc(var(--u) * 3) calc(var(--u) * 6) calc(var(--u) * -3) rgba(115,91,242,.25);transition:all .25s ease}
.card .op.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:500}
.card .op:active{transform:scale(.97)}
.cdots{display:flex;align-items:center;justify-content:center;gap:calc(var(--u) * 11)}
.cdots button{border:0;padding:0;border-radius:50%;cursor:pointer;width:calc(var(--u) * 17);height:calc(var(--u) * 17);background:#EAE6FD;color:#fff;display:grid;place-items:center;transition:width .35s cubic-bezier(.3,1.3,.5,1),height .35s cubic-bezier(.3,1.3,.5,1),background .3s}
.cdots button.on{width:calc(var(--u) * 53);height:calc(var(--u) * 53);background:var(--acc);box-shadow:0 calc(var(--u) * 4) calc(var(--u) * 10) calc(var(--u) * -4) rgba(115,91,242,.6)}
#cbig{position:relative;cursor:default}
#cbig span{position:absolute;inset:0;display:grid;place-items:center;transform:scale(0) rotate(-30deg);opacity:0;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .25s}
#cbig span.on{transform:none;opacity:1}

/* Inicio */
.bell{border:0;background:none;padding:0;cursor:pointer;color:var(--pale)}
.bell:hover{color:var(--acc)}
.hero{border-radius:calc(var(--u) * 10);overflow:hidden;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0)),
    radial-gradient(120% 140% at 0% 0%,#E4D9FB 0%,transparent 60%),radial-gradient(120% 140% at 100% 0%,#F5E6FA 0%,transparent 60%),
    radial-gradient(120% 140% at 0% 100%,#D7CFFB 0%,transparent 60%),radial-gradient(120% 140% at 100% 100%,#F4E5FA 0%,transparent 60%),#ECDFFB;
  box-shadow:0 calc(var(--u) * 6) calc(var(--u) * 12) calc(var(--u) * -6) rgba(115,91,242,.35)}
.mini{white-space:nowrap;padding:0;border:1.3px solid var(--acc-mid);background:#fff;color:var(--acc-mid);border-radius:999px;font:600 calc(var(--u) * 10.5)/1 var(--display);cursor:pointer;transition:background .2s,color .2s}
.mini:hover{background:var(--acc-mid);color:#fff}
.kcard{background:#fff;border-radius:calc(var(--u) * 4)}
.bar{border-radius:9px;background:var(--pink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--plum);border-radius:9px;transition:width 1s cubic-bezier(.3,.9,.3,1)}
.stats{display:flex;border-radius:calc(var(--u) * 8);background:var(--pink)}
.stats>*{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u) * 8);position:relative;border:0;background:none;padding:0;color:inherit}
.stats>*+*::before{content:"";position:absolute;left:0;top:calc(var(--u) * 12);bottom:calc(var(--u) * 12);width:1.5px;background:var(--plum)}
.stats b{font:700 calc(var(--u) * 19)/1 var(--display);color:var(--brand)}
.stats span{font:300 calc(var(--u) * 13)/1 var(--text);color:var(--ink)}
.stats.done{background:var(--plum)} .stats.done b,.stats.done span{color:#fff} .stats.done>*+*::before{background:rgba(255,255,255,.55)}
.stats button{cursor:pointer}
.tip{transition:opacity .35s,transform .35s}
.tip.gone{opacity:0;transform:scale(.96);pointer-events:none}
.x{border:0;padding:0;border-radius:50%;background:#E3DEFC;color:var(--acc);display:grid;place-items:center;cursor:pointer}
.bubble{background:var(--lime);border-radius:calc(var(--u) * 10);display:flex;align-items:center;padding:0 calc(var(--u) * 18);font:300 calc(var(--u) * 12)/1.35 var(--text);color:var(--ink2)}
.bubble b{font-weight:600}
.tile{background:#fff;border:0;border-radius:calc(var(--u) * 6);box-shadow:0 calc(var(--u) * 3) calc(var(--u) * 10) calc(var(--u) * -4) rgba(145,70,172,.25);cursor:pointer;color:var(--plum);
  display:flex;flex-direction:column;align-items:center;transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-2px);box-shadow:0 calc(var(--u) * 8) calc(var(--u) * 14) calc(var(--u) * -6) rgba(145,70,172,.35)}
.tile span{font:300 calc(var(--u) * 11)/1.2 var(--text);text-align:center}
.friends{display:flex;gap:calc(var(--u) * 12);overflow-x:auto;scrollbar-width:none;padding:0 calc(var(--u) * 20);scroll-snap-type:x mandatory}
.friends::-webkit-scrollbar{display:none}
.friends button{flex:none;border:0;padding:0;background:none;width:calc(var(--u) * 100);height:calc(var(--u) * 100);border-radius:50%;overflow:hidden;cursor:pointer;scroll-snap-align:start;transition:transform .2s}
.friends button:hover{transform:scale(1.03)}
.friends img{width:100%;height:100%}
.locked .friends button{opacity:.38;cursor:default}
.locked .friends button:hover{transform:none}

/* Mi plan */
.seg{display:flex;position:relative}
.seg i{position:absolute;top:0;left:0;height:100%;border-radius:999px;background:var(--acc);transition:transform .4s cubic-bezier(.3,1.2,.5,1),width .4s cubic-bezier(.3,1.2,.5,1);box-shadow:0 calc(var(--u) * 4) calc(var(--u) * 10) calc(var(--u) * -4) rgba(115,91,242,.6)}
.seg button{position:relative;z-index:1;border:0;background:none;cursor:pointer;font:600 calc(var(--u) * 14)/1 var(--display);color:#A292F7;transition:color .3s;white-space:nowrap}
.seg button.on{color:#fff}
.ib{border:0;background:none;padding:0;cursor:pointer;color:var(--ink2)}

/* barra de navegación (del UI kit) */
#bar{position:absolute;left:0;right:0;bottom:0;height:calc(100cqw / 4.02 * 1.34);z-index:20;transition:transform .45s cubic-bezier(.22,.8,.24,1),opacity .3s;pointer-events:none}
#bar.hide{transform:translateY(110%);opacity:0}
#bar>*{pointer-events:auto}
.nb-pill{position:absolute;left:calc(24.5cqw/4.02);width:calc(351.5cqw/4.02);top:calc(36.5cqw/4.02);height:calc(52.5cqw/4.02);border-radius:999px;background:#fff;border:1px solid #ECE9F6;box-shadow:0 6px 22px -10px rgba(40,32,85,.25)}
.nb-it{position:absolute;top:calc(38cqw/4.02);height:calc(48cqw/4.02);width:calc(70cqw/4.02);translate:-50% 0;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:calc(5cqw/4.02);color:#8B8B8B;-webkit-tap-highlight-color:transparent}
.nb-it i{display:block;background:#7B7B7B;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;transition:background .25s,transform .35s cubic-bezier(.3,1.5,.5,1)}
.nb-it span{font-family:var(--display);font-weight:500;font-size:calc(8.6cqw/4.02);line-height:1;transition:color .25s;white-space:nowrap}
.nb-it.on{color:var(--acc)} .nb-it.on i{background:var(--acc);transform:translateY(-2px)}
.nb-c{position:absolute;left:calc(171.25cqw/4.02);top:calc(23.25cqw/4.02);width:calc(58cqw/4.02);height:calc(58cqw/4.02);border:0;padding:0;background:none;border-radius:50%;cursor:pointer;filter:drop-shadow(0 4px 8px rgba(115,91,242,.35));transition:transform .2s;-webkit-tap-highlight-color:transparent}
.nb-c:active{transform:scale(.93)} .nb-c img{width:100%;height:100%}
.nb-home{position:absolute;left:calc(137cqw/4.02);width:calc(131cqw/4.02);top:calc(100cqw/4.02);height:calc(4cqw/4.02);border-radius:9px;background:#D9D9D9}

/* aviso breve */
#toast{position:absolute;left:50%;bottom:calc(var(--u) * 150);translate:-50% 0;z-index:40;max-width:calc(var(--u) * 330);background:var(--ink2);color:#fff;border-radius:calc(var(--u) * 14);padding:calc(var(--u) * 10) calc(var(--u) * 16);
  font:400 calc(var(--u) * 13)/1.35 var(--text);text-align:center;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:none}
#phone.dk #status b,#phone.dk #status i{color:#fff}
#phone.nost #status{opacity:0}
</style>

<body>
<div id="stage"><div id="phone">
  <div id="status" aria-hidden="true"><b>9:41</b><i class="msk" style="-webkit-mask-image:url(img/i_status.webp);mask-image:url(img/i_status.webp)"></i></div>
  <div id="bar" class="hide"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div></div>

<script>
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const U=n=>`calc(var(--u) * ${n})`;
const box=(x,y,w,h)=>`left:${U(x)};top:${U(y)};${w!=null?`width:${U(w)};`:''}${h!=null?`height:${U(h)};`:''}`;
const img=(n,x,y,w,h,cls='',alt='')=>`<img class="a ${cls}" src="img/${n}.webp" alt="${alt}" style="${box(x,y,w,h)}">`;
const ic=(n,w,h,extra='')=>`<i class="msk" style="-webkit-mask-image:url(img/${n}.webp);mask-image:url(img/${n}.webp);width:${U(w)};height:${U(h)};${extra}"></i>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const phone=$('#phone');

/* ---------- estado (persistente cuando el navegador lo permite) ---------- */
const DEF={name:'',email:'',hogar:0,rutina:0,salud:0,logged:false,demoDone:false,retos:0,insignias:0,guardados:0,tipClosed:false};
let S={...DEF};
try{const raw=localStorage.getItem('kuska2');if(raw)S={...DEF,...JSON.parse(raw)}}catch(e){}
const save=()=>{try{localStorage.setItem('kuska2',JSON.stringify(S))}catch(e){}};

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function react(el,cls='hop'){if(!el)return;el.classList.remove('hop','wiggle');void el.offsetWidth;el.classList.add(cls)}

/* ---------- sonidos: cada acción tiene el suyo (WebAudio, sin archivos) ---------- */
let AC=null,NZ=null;
function snd(k){if(S.g&&S.g.sound===false)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;
  const tone=(f,d,l,o={})=>{const os=AC.createOscillator(),g=AC.createGain();os.type=o.w||'sine';os.frequency.setValueAtTime(f,t+d);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d+l);
    const v=o.v||.11;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(v,t+d+(o.a||.012));g.gain.exponentialRampToValueAtTime(.0001,t+d+l);os.connect(g).connect(AC.destination);os.start(t+d);os.stop(t+d+l+.05)};
  const noise=(d,l,f1,f2,v=.08,q=1.2)=>{if(!NZ){NZ=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const c=NZ.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}
    const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NZ;bp.type='bandpass';bp.Q.value=q;bp.frequency.setValueAtTime(f1,t+d);bp.frequency.exponentialRampToValueAtTime(f2,t+d+l);
    g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(v,t+d+l*.35);g.gain.exponentialRampToValueAtTime(.0001,t+d+l);s.connect(bp).connect(g).connect(AC.destination);s.start(t+d);s.stop(t+d+l+.05)};
  ({tap:()=>tone(720,0,.05,{w:'triangle',v:.07}),
    type:()=>tone(1500+Math.random()*300,0,.025,{w:'square',v:.018}),
    sel:()=>{tone(520,0,.08);tone(780,.07,.11)},
    back:()=>{tone(620,0,.07);tone(440,.06,.1)},
    toggle:()=>{tone(880,0,.04,{w:'triangle',v:.06});tone(1180,.04,.05,{w:'triangle',v:.05})},
    swipe:()=>noise(0,.24,700,2600,.07),

  <h1 class="a ctr h-disp" style="${box(0,80,402)};margin:0;font-weight:700;font-size:${U(16)};color:var(--ink2);pointer-events:none">Mi Plan</h1>
  <button class="a bell" data-toast="Tus notificaciones llegan en el paso 5" aria-label="Notificaciones" style="${box(357,78,24,26)}">${ic('i_bell',19,21.5)}</button>
  <div class="a seg" id="seg" style="${box(24,156,345,44)}"><i></i><button class="on" style="width:${U(172)}">En evaluación</button><button style="width:${U(173)}">Adopción confirmada</button></div>
  <img class="a kuska float" id="k12" src="img/k12.webp" alt="Kuska" style="${box(125.5,265.5,150.5,186.5)}">
  <h2 class="a ctr h-disp" id="pt" style="${box(0,484,402)};margin:0;font-weight:600;font-size:${U(17)};line-height:${U(21)};color:var(--ink2)">Tu plan se arma<br>después de la demo</h2>
  <p class="a ctr p" id="pb" style="${box(50,538,302)};margin:0;font-size:${U(14)};line-height:${U(19.5)};color:#6B6496">Cuando termines los 12 retos vas a poder sumar animales y armar un plan de cuidados para cada uno.</p>
  <button class="a btn" data-go="demo" style="${box(38,679,327,50)}">Ir a la Demo</button>`,
  mount(el){
    const seg=$('#seg',el),i=$('i',seg),bs=$$('button',seg);
    const set=n=>{bs.forEach((b,j)=>b.classList.toggle('on',j===n));i.style.width=bs[n].offsetWidth+'px';i.style.transform=`translateX(${bs[n].offsetLeft}px)`};
    requestAnimationFrame(()=>set(0));addEventListener('resize',()=>set(bs.findIndex(b=>b.classList.contains('on'))));
    bs.forEach((b,n)=>b.onclick=()=>{set(n);react($('#k12',el))});
    $('#k12',el).onclick=e=>react(e.target,'wiggle');
  }};

/* Pantallas de pasos siguientes (temporales, solo para esta revisión) */
const SOON={
  demo:{t:'La demo de 12 retos',s:'Se arma en el paso 3. Mientras tanto podés ver cómo queda el Inicio al terminarla.',cta:'Ver Inicio con la demo completada',act:'finish'},
  progreso:{t:'Mi progreso',s:'Se arma en el paso 3, junto con la demo, el diario y las insignias.'},
  guardado:{t:'Guardados',s:'Se arma en el paso 4, junto con el catálogo.'},
  catalogo:{t:'Animales en adopción',s:'Es lo próximo que armo (paso 4): órbita y lista de gatos y perros, ficha del animal y postulación.'},
  perfil:{t:'Perfil',s:'Se arma en el paso 5. Para revisar desde cero podés reiniciar la demo acá.',cta:'Reiniciar la demo',act:'reset'},
  invitado:{t:'Modo invitado',s:'Se arma en el paso 5, con Catálogo, Conocé KUSKA, Aprender y Red.',nobar:true},
  asociacion:{t:'Perfil asociación',s:'Se arma en el paso 6, con su propia barra.',nobar:true}};
for(const [k,v] of Object.entries(SOON)){
  SCR[k]={bg:'#F7F5FF',sbg:'#F7F5FF',fit:true,bar:v.nobar?null:({guardado:2,perfil:3}[k]??null),html:()=>`
    <button class="a ib" data-go="back" aria-label="Volver" style="${box(20,76,30,30)}">${ic('i_back',17,14,'margin:auto')}</button>
    <h1 class="a ctr h-disp" style="${box(0,80,402)};margin:0;font-weight:700;font-size:${U(16)};color:var(--ink2);pointer-events:none">${v.t}</h1>
    <img class="a kuska float" src="img/k12.webp" alt="Kuska" style="${box(125.5,215,150.5,186.5)}">
    <p class="a ctr h-disp" style="${box(40,440,322)};margin:0;font-weight:600;font-size:${U(17)};color:var(--ink2)">Próximamente</p>
    <p class="a ctr p" style="${box(50,472,302)};margin:0;font-size:${U(14)};line-height:${U(20)};color:#6B6496">${v.s}</p>
    ${v.cta?`<button class="a btn" id="cta" style="${box(38,600,327,50)}">${v.cta}</button>`:''}`,
    mount(el){const c=$('#cta',el);if(c)c.onclick=()=>{if(v.act==='finish')finishDemo();else{S={...DEF};save();go('splash',{root:true})}};
      const k=$('.kuska',el);k.onclick=()=>react(k,'wiggle')}};
}

/* ---------- navegación con historial (el botón atrás del navegador funciona) ---------- */
let curEl=null,cleanup=null,idx=0;
function render(name,dir=1){
  const def=SCR[String(name).split('?')[0]]||SCR.splash;
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  const el=document.createElement('div');el.className='scr in';el.style.setProperty('--bg',def.bg);el.style.setProperty('--dx',dir);
  el.innerHTML=def.fit?`<div class="fr fit">${def.html()}</div>`:def.html();
  phone.insertBefore(el,$('#status'));
  phone.style.setProperty('--sbg',def.sbg||'transparent');phone.classList.toggle('dk',!!def.dark);phone.classList.toggle('nost',!!def.nostatus);
  if(curEl){const old=curEl;old.style.setProperty('--dx',dir);old.classList.remove('in');old.classList.add('out');setTimeout(()=>old.remove(),320)}
  curEl=el;el.addEventListener('animationend',()=>el.classList.remove('in'),{once:true});
  drawBar(def.bar);
  if(def.swipe){let x0=null;el.addEventListener('pointerdown',e=>x0=e.clientX);el.addEventListener('pointerup',e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;
    if(dx<-50&&def.swipe.left){snd('swipe');go(def.swipe.left)}if(dx>50&&def.swipe.right){snd('swipe');def.swipe.right==='back'?history.back():go(def.swipe.right)}})}
  cleanup=def.mount?def.mount(el)||null:null;
}
function go(name,o={}){
  if(name==='back'){if(idx>0)history.back();else go(S.logged?'inicio':'registro',{replace:true});return}
  if(name==='inicio'&&!S.logged){S.logged=true;save()}
  if(o.root||o.replace){history.replaceState({s:name,i:idx},'','#'+name)}
  else{idx++;history.pushState({s:name,i:idx},'','#'+name)}
  render(name,1);
}
addEventListener('popstate',e=>{const st=e.state||{s:(location.hash.slice(1)||'splash'),i:0};const dir=st.i<idx?-1:1;idx=st.i||0;render(st.s,dir)});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g&&!g.closest('#bar')){e.preventDefault();snd(g.dataset.go==='back'?'back':/intro|registro/.test(g.dataset.go)?'swipe':'tap');go(g.dataset.go);return}
  const t=e.target.closest('[data-toast]');if(t)toast(t.dataset.toast)});

/* arranque */
document.addEventListener('DOMContentLoaded',function(){
  const h=location.hash.slice(1);
  const start=SCR[h.split('?')[0]]&&h!=='splash'?h:'splash';
  history.replaceState({s:start,i:0},'','#'+start);render(start,1);
});
</script>
